name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escrowatt
          POSTGRES_PASSWORD: escrowatt_secret
          POSTGRES_DB: escrowatt_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Lint & Format Check
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Mypy Type Check
        run: |
          mypy src

      - name: Run Test Suite with Coverage (fail under 85%)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest tests -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Run Property-Based Tests (Hypothesis)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          ENVIRONMENT: test
        run: |
          pytest tests/property -v

      - name: Run 100-Worker Concurrency Stress Tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          ENVIRONMENT: test
        run: |
          pytest tests/concurrency -v
